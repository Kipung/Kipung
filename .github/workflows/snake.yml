name: snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2547d0&color_dots=#ebe8e0,#c9d3f5,#93a8ec,#5574de,#2547d0
            dist/snake-dark.svg?palette=github-dark&color_snake=#7c9bff&color_dots=#161b22,#1c2a52,#2c4290,#4d6ad6,#7c9bff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="476" viewBox="0 0 300 476" role="img" aria-label="Terminal Browser Split: A live, clickable browser preview in a native terminal split, opened by you with a hotkey or by any coding agent with one command.">
<style>
  .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }

<text x="24" y="36.0" class="m dim" font-size="13">Ki-Pung Park · Riverside, CA</text><text x="22" y="102.0" class="s ink r1" font-size="56" font-weight="700" letter-spacing="-1.5">Kip Park</text><text x="24" y="149.8" class="s ink r2" font-size="23" font-weight="500">AI researcher and engineer,</text><text x="24" y="180.8" class="s ink r2" font-size="23" font-weight="500">focused on language models.</text><text x="24" y="218.2" class="s dim" font-size="17">CS (ML &amp; AI, ’27) at California Baptist</text><text x="24" y="244.2" class="s dim" font-size="17">University. I build source-verified fine-tuning</text><text x="24" y="270.1" class="s dim" font-size="17">pipelines, run controlled LLM experiments, and</text><text x="24" y="296.1" class="s dim" font-size="17">ship local-first AI tools that people actually</text><text x="24" y="322.1" class="s dim" font-size="17">use.</text><rect x="24" y="356" width="432" height="240" rx="12" fill="#111111" stroke="#ffffff1a"/>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="490" height="446.5" viewBox="0 0 490 446.5" role="img" aria-label="Terminal Browser Split: A live, clickable browser preview in a native terminal split, opened by you with a hotkey or by any coding agent with one command.">
<style>
  .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .ink { fill: #ededed; }
  .dim { fill: #a1a1a1; }
  .acc { fill: #7c9bff; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
  @keyframes ping { 0% { transform: scale(1); opacity: .6 } 100% { transform: scale(3); opacity: 0 } }
  @keyframes flow { to { stroke-dashoffset: -16 } }
  .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
  .flow { stroke-dasharray: 4 4; animation: flow 1s linear infinite; }
</style>
